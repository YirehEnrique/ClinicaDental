<!DOCTYPE html>
{% load static %}
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
            Restaurar Contraseña | Clínica Solís
            {% endblock title %}
        </title>
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
        <link rel="stylesheet" href="/static/css/login.css">
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card card-login bg-white">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                {% if error %}
                                <p style="color: red;">Ocurrio un error {{error}}</p>
                                {% endif %}
                                {% if mensaje %}
                                    <p style="color: green;">{{ mensaje }}</p>
                                    <meta http-equiv="refresh" content="3;url={% url 'cita' %}">
                                {% endif %}
                                <div class="rounded-circle mx-auto shadow-sm mb-3 overflow-hidden"
                                    style="width: 90px; height: 90px;">
                                    <img src="{% static 'img/logo.png' %}"
                                        alt="Logo Clínica Solís"
                                        class="w-100 h-100 object-fit-cover">
                                </div>
                                <h3 class="brand-header" style="color:rgb(63, 182, 182)">Clínica Solís</h3>
                                <p class="text-muted small">Rellene los Campos para Cambiar la Contraseña</p>

                                <form method="post">
                                    {% csrf_token %}
                                    <!-- Agregamos el primer campo contraseña actual-->
                                    <div class="mb-3">
                                        <label class="form-label small text-muted fw-bold">Contraseña Actual</label><br>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-secondary"></i></span>
                                            <input type="password" name="actual" class="form-control border-start-0 ps-0"><br><br>
                                        </div>
                                    </div>

                                    <!-- Agregamos el primer campo contraseña nueva 1-->
                                    <div class="mb-3">
                                        <label class="form-label small text-muted fw-bold">Nueva Contraseña</label><br>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-secondary"></i></span>
                                            <input type="password" name="nueva" class="form-control border-start-0 ps-0"><br><br>
                                        </div>
                                    </div>

                                    <!-- Agregamos el primer campo contraseña nueva 2-->
                                    <div class="mb-3">
                                        <label class="form-label small text-muted fw-bold">Confirme Nueva Contraseña</label><br>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-secondary"></i></span>
                                            <input type="password" name="confirm_nueva" class="form-control border-start-0 ps-0"><br><br>
                                        </div>
                                    </div>
                                    <!-- Agregamos el botón para cambiarlo en la bd -->
                                    <div class="d-grid">
                                        <button type="submit"
                                            class="btn shadow-sm fw-bold text-white" style="background-color: rgb(63, 182, 182) ;">
                                            Cambiar Contraseña
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
