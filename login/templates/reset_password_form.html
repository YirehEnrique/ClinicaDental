<!-- reset_password_form.html -->
<!DOCTYPE html>
{% load static %}
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
            Restaurar Contraseña | Clínica Solís
            {% endblock title %}
        </title>
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
        <link rel="stylesheet" href="/static/css/login.css">
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card card-login bg-white">
                        <div class="card-body p-4">
                            <!-- Si el link es válido -->
                            {% if validlink %}
                            <!-- Div para cabecera -->
                            <div class="text-center mb-4">
                                <div class="rounded-circle mx-auto shadow-sm mb-3 overflow-hidden"
                                    style="width: 90px; height: 90px;">
                                    <img src="{% static 'img/logo.png' %}"
                                        alt="Logo Clínica Solís"
                                        class="w-100 h-100 object-fit-cover">
                                </div>
                                <!-- Solo colocamos generalidades -->
                                <h3 class="brand-header" style="color:rgb(63, 182, 182)">Clínica Solís</h3>
                                <p class="text-muted small">Favor de Completar los Campos</p>
                            </div>

                            <!-- creamos el form contenedor -->
                            <form method="post">
                                {% csrf_token %}
                                <!-- Agregamos el primer campo de nueva contraseña -->
                                <div class="mb-3">
                                    <label class="form-label small text-muted fw-bold">Nueva Contraseña</label><br>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-secondary"></i></span>
                                        <input type="password" name="password" class="form-control border-start-0 ps-0"><br><br>
                                    </div>
                                </div>

                                <!-- Agregamos la confirmación de la nueva contraseña -->
                                <div class="mb-3">
                                    <label class="form-label small text-muted fw-bold">Confirmar Nueva Contraseña</label><br>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-secondary"></i></span>
                                        <input type="password" name="confirm_password" class="form-control border-start-0 ps-0"><br><br>
                                    </div>
                                </div>

                                <!-- Agregamos el botón para cambiarlo en la bd -->
                                <div class="d-grid">
                                    <button type="submit"
                                        class="btn shadow-sm fw-bold text-white" style="background-color: rgb(63, 182, 182) ;">
                                        Cambiar Contraseña
                                    </button>
                                </div>
                            </form>
                            {% else %}
                            <p>El enlace no es válido</p>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
