<!-- recuperar_contra.html -->
<!DOCTYPE html>
{% load static %}
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
            Restaurar Contraseña | Clínica Solís
            {% endblock title %}
        </title>
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
        <link rel="stylesheet" href="/static/css/login.css">
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card card-login bg-white">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                {% if mensaje %}
                                <p style="color: green; background-color: rgb(113, 160, 160);">{{ mensaje }}</p>
                                <meta http-equiv="refresh" content="3;url={% url 'login' %}">
                                {% endif %}
                                {% if error %}
                                <p style="color: red;background-color: rgb(113, 160, 160);">{{ error }}</p>
                                {% endif %}
                                <div class="rounded-circle mx-auto shadow-sm mb-3 overflow-hidden"
                                    style="width: 90px; height: 90px;">
                                    <img src="{% static 'img/logo.png' %}"
                                        alt="Logo Clínica Solís"
                                        class="w-100 h-100 object-fit-cover">
                                </div>
                                <h3 class="brand-header" style="color:rgb(63, 182, 182)">Clínica Solís</h3>
                                <p class="text-muted small">Favor de Completar los Campos</p>
                            </div>
                            <!-- creamos el form contenedor -->
                            <form method="post">
                                {% csrf_token %}
                                <!-- agregamos el primer campo de correo, y lo decoramos -->
                                <div class="mb-3">
                                    <label class="form-label small text-muted fw-bold">Correo</label><br>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"> <i class="bi bi-person-circle text-secondary"></i></span>
                                        <input type="email" name="email1" class="form-control border-start-0 ps-0" required><br>
                                    </div>
                                </div>

                                <!-- Agregamos la confirmación del correo y lo decoramos -->
                                <div class="mb-3">
                                    <label class="form-label small text-muted fw-bold">Confirmar Correo</label><br>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"> <i class="bi bi-person-circle text-secondary"></i></span>
                                        <input type="email" name="email2" class="form-control border-start-0 ps-0" required><br><br>
                                    </div>
                                </div>

                                <!-- Agregamos el botón para enviar el reestablecimiento -->
                                <div class="d-grid">
                                    <button type="submit"
                                        class="btn shadow-sm fw-bold text-white" style="background-color: rgb(63, 182, 182) ;">
                                        Enviar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
